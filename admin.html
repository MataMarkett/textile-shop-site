<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mata Маркет — Админ-панель</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --blue:#5b59e8;
    --blue-dark:#4140c7;
    --dark:#202126;
    --gray:#70727d;
    --light:#f5f5fa;
    --white:#fff;
    --border:#e5e5ed;
    --yellow:#f59e0b;
    --green:#16a34a;
    --orange:#ea580c;
    --red:#dc2626;
    --shadow:0 10px 30px rgba(0,0,0,.06);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--dark);
    line-height:1.5;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1400px,94%);margin:auto}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    min-height:72px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:20px;
    font-weight:800;
}

.logo img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.header-actions{
    display:flex;
    gap:10px;
}

.header-btn{
    border:0;
    background:#eeeeff;
    color:var(--blue);
    padding:11px 16px;
    border-radius:11px;
    font-weight:bold;
}

.header-btn:hover{background:#e1e1ff}

/* MAIN */
main{padding:35px 0 70px}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:25px;
}

.page-title h1{font-size:34px}
.page-title p{color:var(--gray);margin-top:5px}

.live{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--green);
    font-size:13px;
    font-weight:bold;
}

.live-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{opacity:.35;transform:scale(.8)}
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.02);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.stat-label{
    color:var(--gray);
    font-size:14px;
}

.stat-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eeeeff;
    font-size:21px;
}

.stat-value{
    font-size:28px;
    font-weight:800;
}

/* TOOLBAR */
.toolbar{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.search{
    flex:1;
    position:relative;
}

.search span{
    position:absolute;
    left:15px;
    top:12px;
}

.search input{
    width:100%;
    height:46px;
    border:1px solid var(--border);
    border-radius:11px;
    padding:0 15px 0 42px;
    outline:none;
    background:#fafafd;
}

.search input:focus{
    border-color:var(--blue);
}

.filter{
    min-width:190px;
    height:46px;
    border:1px solid var(--border);
    border-radius:11px;
    padding:0 12px;
    background:#fafafd;
    outline:none;
}

/* ORDERS */
.orders{
    display:grid;
    gap:14px;
}

.order{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    transition:.2s;
}

.order:hover{
    box-shadow:var(--shadow);
    transform:translateY(-1px);
}

.order.new{
    border:2px solid #fbbf24;
    background:linear-gradient(135deg,#fffdf4,#fff);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.order-number{
    font-size:18px;
    font-weight:800;
}

.order-date{
    color:var(--gray);
    font-size:13px;
    margin-top:4px;
}

.order-customer{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.info{
    background:#f8f8fc;
    border-radius:12px;
    padding:12px;
}

.info small{
    color:var(--gray);
    display:block;
    margin-bottom:4px;
}

.info strong{
    word-break:break-word;
}

.order-items{
    margin-top:12px;
    color:var(--gray);
    font-size:14px;
}

.order-bottom{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.order-total{
    font-size:21px;
    font-weight:800;
}

.order-actions{
    display:flex;
    gap:8px;
}

.action-btn{
    border:0;
    border-radius:10px;
    padding:10px 13px;
    font-weight:bold;
}

.view-btn{
    background:#eeeeff;
    color:var(--blue);
}

.delete-btn{
    background:#ffe9e9;
    color:var(--red);
}

/* STATUS */
.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border-radius:30px;
    padding:7px 11px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.status-new{background:#fff3cd;color:#9a6700}
.status-processing{background:#e8e9ff;color:#4946c7}
.status-collected{background:#fff0df;color:#b45309}
.status-shipped{background:#e1f0ff;color:#1769aa}
.status-completed{background:#dcfce7;color:#15803d}
.status-cancelled{background:#fee2e2;color:#b91c1c}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.active{display:flex}

.modal-box{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:22px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:10px;
    background:#f0f0f5;
    font-size:20px;
}

.modal-section{margin-top:22px}
.modal-section h3{margin-bottom:10px}

.customer-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.detail{
    background:#f7f7fb;
    border-radius:12px;
    padding:13px;
}

.detail small{
    color:var(--gray);
    display:block;
    margin-bottom:4px;
}

.items{display:grid;gap:8px}

.item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
}

.item-name{font-weight:bold}
.item-meta{color:var(--gray);font-size:13px}

.modal-total{
    display:flex;
    justify-content:space-between;
    padding:16px;
    margin-top:15px;
    border-radius:13px;
    background:var(--dark);
    color:#fff;
}

.modal-total strong{font-size:20px}

.status-change{
    display:flex;
    gap:10px;
}

.status-change select{
    flex:1;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
}

.save-btn{
    border:0;
    background:var(--blue);
    color:#fff;
    border-radius:10px;
    padding:11px 18px;
    font-weight:bold;
}

.save-btn:hover{background:var(--blue-dark)}

.edit-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.edit-field{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.edit-field label{
    color:var(--gray);
    font-size:13px;
}

.edit-field input,
.edit-field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
    outline:none;
}

.edit-field input:focus,
.edit-field textarea:focus{
    border-color:var(--blue);
}

.edit-field.full{grid-column:1/-1}

/* EMPTY */
.empty{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    text-align:center;
    padding:60px 20px;
    color:var(--gray);
}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

/* TOAST */
.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:2000;
    background:#202126;
    color:#fff;
    padding:14px 18px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* MOBILE */
@media(max-width:900px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .order-customer{grid-template-columns:1fr 1fr}
}

@media(max-width:650px){
    .container{width:calc(100% - 24px)}
    main{padding-top:22px}

    .page-title{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-title h1{font-size:28px}

    .header-inner{
        min-height:62px;
    }

    .logo{
        font-size:17px;
    }

    .logo img{
        width:40px;
        height:40px;
    }

    .header-btn{
        padding:9px 10px;
        font-size:13px;
    }

    .toolbar{
        flex-direction:column;
    }

    .filter{
        width:100%;
    }

    .order{
        padding:15px;
    }

    .order-top{
        flex-direction:column;
    }

    .order-customer{
        grid-template-columns:1fr;
    }

    .order-bottom{
        flex-direction:column;
        align-items:stretch;
    }

    .order-actions{
        width:100%;
    }

    .action-btn{
        flex:1;
    }

    .customer-grid,
    .edit-grid{
        grid-template-columns:1fr;
    }

    .edit-field.full{
        grid-column:auto;
    }

    .status-change{
        flex-direction:column;
    }
}

@media(max-width:400px){
    .stats{
        gap:8px;
    }

    .stat{
        padding:14px;
    }

    .stat-value{
        font-size:20px;
    }

    .header-actions{
        gap:5px;
    }
}
</style>
</head>

<body>

<header>
<div class="container header-inner">

    <div class="logo">
        <img src="mata-logo.jpg" alt="Mata Маркет">
        <span>Mata Маркет</span>
    </div>

    <div class="header-actions">
        <button class="header-btn" onclick="loadOrders()">
            🔄 Обновить
        </button>

        <a class="header-btn" href="index.html">
            🛍️ Магазин
        </a>
    </div>

</div>
</header>

<main>
<div class="container">

    <div class="page-title">
        <div>
            <h1>🛒 Заказы</h1>
            <p>Панель управления заказами Mata Маркет</p>
        </div>

        <div class="live">
            <span class="live-dot"></span>
            Онлайн
        </div>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-top">
                <div class="stat-label">Всего заказов</div>
                <div class="stat-icon">🛒</div>
            </div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div class="stat-label">Новые</div>
                <div class="stat-icon">🟡</div>
            </div>
            <div class="stat-value" id="newOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div class="stat-label">Выполнено</div>
                <div class="stat-icon">✅</div>
            </div>
            <div class="stat-value" id="completedOrders">0</div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div class="stat-label">Сумма заказов</div>
                <div class="stat-icon">💰</div>
            </div>
            <div class="stat-value" id="totalRevenue">0 ₸</div>
        </div>

    </div>

    <div class="toolbar">

        <div class="search">
            <span>🔎</span>
            <input
                id="search"
                type="search"
                placeholder="Поиск по имени, телефону или номеру заказа..."
                oninput="renderOrders()">
        </div>

        <select
            class="filter"
            id="statusFilter"
            onchange="renderOrders()">

            <option value="all">Все статусы</option>
            <option value="Новый">🟡 Новый</option>
            <option value="В обработке">🔵 В обработке</option>
            <option value="Собран">🟠 Собран</option>
            <option value="Отправлен">🚚 Отправлен</option>
            <option value="Выполнен">🟢 Выполнен</option>
            <option value="Отменён">🔴 Отменён</option>

        </select>

    </div>

    <div class="orders" id="orders">

        <div class="empty">
            <div class="empty-icon">⏳</div>
            Загрузка заказов...
        </div>

    </div>

</div>
</main>

<div class="modal" id="orderModal">
<div class="modal-box">

    <div class="modal-header">
        <h2 id="modalTitle">Заказ</h2>

        <button class="close" onclick="closeModal()">✕</button>
    </div>

    <div id="modalContent"></div>

</div>
</div>

<div class="toast" id="toast">Готово</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://jcdghaehpdrawxoetqmm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_t5zOzDbKIghdy0r9hzukNQ_AmmdZZ8O";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let orders = [];
let selectedOrder = null;
let previousOrderCount = 0;


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const container =
        document.getElementById("orders");

    if(!orders.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⏳</div>
                Загружаем заказы...
            </div>
        `;

    }

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">❌</div>

                <strong>
                    Не удалось загрузить заказы
                </strong>

                <p style="margin-top:8px">
                    ${escapeHtml(error.message)}
                </p>
            </div>
        `;

        return;
    }

    const newData = data || [];

    if(
        previousOrderCount > 0 &&
        newData.length > previousOrderCount
    ){
        showToast("🔔 Появился новый заказ!");
    }

    previousOrderCount = newData.length;

    orders = newData;

    updateStats();
    renderOrders();
}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

    const container =
        document.getElementById("orders");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const status =
        document
        .getElementById("statusFilter")
        .value;

    const filtered =
        orders.filter(order => {

            const text = `
                ${order.id || ""}
                ${order.customer_name || ""}
                ${order.customer_phone || ""}
                ${order.delivery_address || ""}
            `.toLowerCase();

            return (
                (!search || text.includes(search)) &&
                (status === "all" || order.status === status)
            );

        });

    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📭</div>
                Заказы не найдены.
            </div>
        `;

        return;
    }

    container.innerHTML =
        filtered.map(order => orderCard(order)).join("");
}


/* =====================================================
   ORDER CARD
===================================================== */

function orderCard(order){

    const isNew =
        order.status === "Новый";

    const items =
        Array.isArray(order.items)
        ? order.items
        : [];

    const itemText =
        items.length
        ? items.map(item =>
            `${item.name || "Товар"} × ${item.quantity || 1}`
          ).join(", ")
        : "Товары не указаны";

    return `
        <div class="order ${isNew ? "new" : ""}">

            <div class="order-top">

                <div>
                    <div class="order-number">
                        #${escapeHtml(String(order.id))}
                    </div>

                    <div class="order-date">
                        ${formatDate(order.created_at)}
                    </div>
                </div>

                ${statusBadge(order.status)}

            </div>

            <div class="order-customer">

                <div class="info">
                    <small>👤 Покупатель</small>
                    <strong>
                        ${escapeHtml(order.customer_name || "—")}
                    </strong>
                </div>

                <div class="info">
                    <small>📞 Телефон</small>
                    <strong>
                        ${escapeHtml(order.customer_phone || "—")}
                    </strong>
                </div>

                <div class="info">
                    <small>🚚 Доставка</small>
                    <strong>
                        ${escapeHtml(order.delivery_type || "—")}
                    </strong>
                </div>

            </div>

            <div class="order-items">
                📦 ${escapeHtml(itemText)}
            </div>

            <div class="order-bottom">

                <div>
                    <div style="color:#70727d;font-size:12px">
                        Сумма
                    </div>

                    <div class="order-total">
                        ${formatPrice(Number(order.total) || 0)} ₸
                    </div>
                </div>

                <div class="order-actions">

                    <button
                        class="action-btn view-btn"
                        onclick="openOrder('${escapeJs(String(order.id))}')">

                        👁 Открыть

                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="deleteOrder('${escapeJs(String(order.id))}')">

                        🗑️ Удалить

                    </button>

                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   STATUS
===================================================== */

function statusBadge(status){

    const classes = {
        "Новый":"status-new",
        "В обработке":"status-processing",
        "Собран":"status-collected",
        "Отправлен":"status-shipped",
        "Выполнен":"status-completed",
        "Отменён":"status-cancelled"
    };

    const icons = {
        "Новый":"🟡",
        "В обработке":"🔵",
        "Собран":"🟠",
        "Отправлен":"🚚",
        "Выполнен":"🟢",
        "Отменён":"🔴"
    };

    return `
        <span class="status ${classes[status] || "status-processing"}">
            ${icons[status] || "⚪"}
            ${escapeHtml(status || "Без статуса")}
        </span>
    `;
}


/* =====================================================
   OPEN ORDER
===================================================== */

function openOrder(id){

    selectedOrder =
        orders.find(
            order =>
                String(order.id) === String(id)
        );

    if(!selectedOrder) return;

    const order = selectedOrder;

    const items =
        Array.isArray(order.items)
        ? order.items
        : [];

    document.getElementById("modalTitle")
        .textContent = `Заказ #${order.id}`;

    document.getElementById("modalContent").innerHTML = `

        ${statusBadge(order.status)}

        <div class="modal-section">

            <h3>👤 Покупатель</h3>

            <div class="customer-grid">

                <div class="detail">
                    <small>Имя</small>
                    <strong>
                        ${escapeHtml(order.customer_name || "—")}
                    </strong>
                </div>

                <div class="detail">
                    <small>Телефон</small>
                    <strong>
                        ${escapeHtml(order.customer_phone || "—")}
                    </strong>
                </div>

                <div class="detail">
                    <small>Способ получения</small>
                    <strong>
                        ${escapeHtml(order.delivery_type || "—")}
                    </strong>
                </div>

                <div class="detail">
                    <small>Адрес</small>
                    <strong>
                        ${escapeHtml(order.delivery_address || "—")}
                    </strong>
                </div>

            </div>

        </div>


        <div class="modal-section">

            <h3>📦 Товары</h3>

            <div class="items">

                ${
                    items.length

                    ? items.map(item => `

                        <div class="item">

                            <div>

                                <div class="item-name">
                                    ${escapeHtml(item.icon || "📦")}
                                    ${escapeHtml(item.name || "Товар")}
                                </div>

                                <div class="item-meta">
                                    ${formatPrice(Number(item.price) || 0)}
                                    ₸ ×
                                    ${Number(item.quantity) || 1}
                                </div>

                            </div>

                            <strong>
                                ${formatPrice(
                                    (Number(item.price) || 0) *
                                    (Number(item.quantity) || 1)
                                )} ₸
                            </strong>

                        </div>

                    `).join("")

                    : "<p>Товары отсутствуют.</p>"
                }

            </div>

            <div class="modal-total">
                <span>Итого</span>

                <strong>
                    ${formatPrice(Number(order.total) || 0)} ₸
                </strong>
            </div>

        </div>


        <div class="modal-section">

            <h3>💬 Комментарий</h3>

            <div class="detail">
                ${escapeHtml(order.comment || "Нет комментария")}
            </div>

        </div>


        <div class="modal-section">

            <h3>✏️ Изменить данные</h3>

            <div class="edit-grid">

                <div class="edit-field">
                    <label>Имя</label>
                    <input
                        id="editName"
                        value="${escapeHtml(order.customer_name || "")}">
                </div>

                <div class="edit-field">
                    <label>Телефон</label>
                    <input
                        id="editPhone"
                        value="${escapeHtml(order.customer_phone || "")}">
                </div>

                <div class="edit-field">
                    <label>Тип доставки</label>
                    <input
                        id="editDelivery"
                        value="${escapeHtml(order.delivery_type || "")}">
                </div>

                <div class="edit-field">
                    <label>Адрес</label>
                    <input
                        id="editAddress"
                        value="${escapeHtml(order.delivery_address || "")}">
                </div>

                <div class="edit-field full">
                    <label>Комментарий</label>
                    <textarea id="editComment" rows="3">${escapeHtml(order.comment || "")}</textarea>
                </div>

            </div>

            <button
                class="save-btn"
                style="margin-top:10px"
                onclick="saveOrderData()">

                💾 Сохранить данные

            </button>

        </div>


        <div class="modal-section">

            <h3>🔄 Статус заказа</h3>

            <div class="status-change">

                <select id="newStatus">

                    ${statusOption("Новый",order.status)}
                    ${statusOption("В обработке",order.status)}
                    ${statusOption("Собран",order.status)}
                    ${statusOption("Отправлен",order.status)}
                    ${statusOption("Выполнен",order.status)}
                    ${statusOption("Отменён",order.status)}

                </select>

                <button
                    class="save-btn"
                    onclick="updateStatus()">

                    💾 Сохранить статус

                </button>

            </div>

        </div>
    `;

    document
        .getElementById("orderModal")
        .classList.add("active");
}


function statusOption(name,current){

    return `
        <option
            value="${name}"
            ${current === name ? "selected" : ""}>
            ${name}
        </option>
    `;
}


/* =====================================================
   SAVE ORDER DATA
===================================================== */

async function saveOrderData(){

    if(!selectedOrder) return;

    const updateData = {
        customer_name:
            document.getElementById("editName").value.trim(),

        customer_phone:
            document.getElementById("editPhone").value.trim(),

        delivery_type:
            document.getElementById("editDelivery").value.trim(),

        delivery_address:
            document.getElementById("editAddress").value.trim(),

        comment:
            document.getElementById("editComment").value.trim()
    };

    const {error} =
        await supabaseClient
        .from("orders")
        .update(updateData)
        .eq("id",selectedOrder.id);

    if(error){

        console.error(error);

        showToast("❌ Не удалось сохранить");

        return;
    }

    Object.assign(selectedOrder,updateData);

    const index =
        orders.findIndex(
            order =>
                String(order.id) ===
                String(selectedOrder.id)
        );

    if(index !== -1){
        Object.assign(orders[index],updateData);
    }

    renderOrders();

    showToast("✅ Данные сохранены");
}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(){

    if(!selectedOrder) return;

    const status =
        document.getElementById("newStatus").value;

    const {error} =
        await supabaseClient
        .from("orders")
        .update({status:status})
        .eq("id",selectedOrder.id);

    if(error){

        console.error(error);

        showToast("❌ Не удалось изменить статус");

        return;
    }

    selectedOrder.status = status;

    const index =
        orders.findIndex(
            order =>
                String(order.id) ===
                String(selectedOrder.id)
        );

    if(index !== -1){
        orders[index].status = status;
    }

    updateStats();
    renderOrders();

    showToast("✅ Статус изменён");

    closeModal();
}


/* =====================================================
   DELETE
===================================================== */

async function deleteOrder(id){

    const order =
        orders.find(
            item =>
                String(item.id) === String(id)
        );

    if(!order) return;

    const confirmed =
        confirm(
            `Удалить заказ #${order.id}?\n\n` +
            `Покупатель: ${order.customer_name || "—"}\n` +
            `Сумма: ${formatPrice(Number(order.total) || 0)} ₸`
        );

    if(!confirmed) return;

    const {error} =
        await supabaseClient
        .from("orders")
        .delete()
        .eq("id",id);

    if(error){

        console.error(error);

        showToast("❌ Не удалось удалить заказ");

        return;
    }

    orders =
        orders.filter(
            item =>
                String(item.id) !== String(id)
        );

    updateStats();
    renderOrders();

    showToast("🗑️ Заказ удалён");
}


/* =====================================================
   STATISTICS
===================================================== */

function updateStats(){

    const total = orders.length;

    const newCount =
        orders.filter(
            order => order.status === "Новый"
        ).length;

    const completed =
        orders.filter(
            order => order.status === "Выполнен"
        ).length;

    const revenue =
        orders.reduce(
            (sum,order) =>
                sum + (Number(order.total) || 0),
            0
        );

    document.getElementById("totalOrders")
        .textContent = total;

    document.getElementById("newOrders")
        .textContent = newCount;

    document.getElementById("completedOrders")
        .textContent = completed;

    document.getElementById("totalRevenue")
        .textContent = formatPrice(revenue) + " ₸";
}


/* =====================================================
   HELPERS
===================================================== */

function formatPrice(value){

    return new Intl.NumberFormat("ru-RU")
        .format(value);
}


function formatDate(value){

    if(!value) return "Дата неизвестна";

    const date = new Date(value);

    return date.toLocaleString("ru-RU",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeJs(value){

    return String(value)
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'")
        .replaceAll("\n","\\n")
        .replaceAll("\r","\\r");
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => toast.classList.remove("show"),
            3000
        );
}


/* =====================================================
   MODAL
===================================================== */

function closeModal(){

    document
        .getElementById("orderModal")
        .classList.remove("active");

    selectedOrder = null;
}


document
    .getElementById("orderModal")
    .addEventListener("click",function(event){

        if(event.target === this){
            closeModal();
        }

    });


document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){
        closeModal();
    }

});


/* =====================================================
   SUPABASE REALTIME
===================================================== */

supabaseClient
    .channel("orders-admin")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"orders"
        },
        payload => {

            if(payload.eventType === "INSERT"){
                showToast("🔔 Новый заказ!");
            }

            loadOrders();
        }
    )
    .subscribe();


/* =====================================================
   START
===================================================== */

loadOrders();

/* Резервное обновление каждые 30 секунд */
setInterval(loadOrders,30000);

</script>

</body>
</html>
